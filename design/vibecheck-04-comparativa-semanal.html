<title>VibeCheck · Comparativa semanal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --page-bg: #EDE9E3; }
@media (prefers-color-scheme: dark) { :root { --page-bg: #1C191F; } }
:root[data-theme="light"] { --page-bg: #EDE9E3; }
:root[data-theme="dark"]  { --page-bg: #1C191F; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--page-bg);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 20px 48px;
}

.phone {
  width: 310px;
  background: #2B2730;
  border-radius: 48px;
  padding: 13px;
  box-shadow: 0 4px 0 #18151C, 0 28px 68px rgba(0,0,0,.42), 0 8px 20px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.07);
  position: relative;
}
.phone::before {
  content: '';
  position: absolute;
  top: 13px; left: 50%;
  transform: translateX(-50%);
  width: 88px; height: 7px;
  background: #1A171E;
  border-radius: 0 0 5px 5px;
  z-index: 2;
}

.screen {
  background: #FAF8F5;
  border-radius: 36px;
  overflow: hidden;
  min-height: 640px;
  display: flex;
  flex-direction: column;
}
.status-bar {
  padding: 18px 20px 0;
  font-size: 13px; font-weight: 600; color: #2B2730;
  text-align: center; letter-spacing: -.01em;
}
.screen-body { flex: 1; padding: 0 18px; display: flex; flex-direction: column; }

.app-icon {
  width: 44px; height: 44px;
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
  flex-shrink: 0;
}
.divider { height: 1px; background: #EAE5DF; margin: 12px 0; }

.tab-bar {
  border-top: 1px solid #EAE5DF;
  background: #fff;
  display: flex;
  padding: 6px 0 14px;
  margin-top: auto;
}
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: #7A7480; }
.tab-item.active { color: #E8967A; font-weight: 600; }

.home-bar-wrap { display: flex; justify-content: center; padding: 5px 0 8px; background: #fff; }
.home-bar { width: 100px; height: 4px; background: rgba(43,39,48,.22); border-radius: 2px; }

.legend { display: flex; gap: 14px; margin-bottom: 12px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #7A7480; }
.legend-dot { width: 9px; height: 9px; border-radius: 2px; }

.comp-row {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(43,39,48,.06);
  padding: 10px 12px;
  margin-bottom: 8px;
  display: flex; align-items: flex-start; gap: 10px;
}
.comp-name { font-size: 14px; font-weight: 700; color: #2B2730; }
.comp-cat  { font-size: 11px; color: #7A7480; }
.comp-bars { margin-top: 7px; display: flex; flex-direction: column; gap: 5px; }
.bar-row   { display: flex; align-items: center; gap: 5px; }
.bar-fill  { height: 7px; border-radius: 4px; flex-shrink: 0; }
.bar-this  { background: #E8967A; }
.bar-prev  { background: #D8D4CE; }
.bar-lbl   { font-size: 11px; color: #7A7480; white-space: nowrap; font-variant-numeric: tabular-nums; }
.delta     { font-size: 12px; font-weight: 700; }
.d-up      { color: #D4A24C; }
.d-dn      { color: #7A9E7E; }
.d-fl      { color: #7A7480; }
</style>

<div class="phone">
  <div class="screen">
    <div class="status-bar">9:41</div>
    <div class="screen-body">

      <!-- Title -->
      <div style="padding-top:12px">
        <div style="font-size:27px;font-weight:700;color:#2B2730;line-height:1.2">Comparativa</div>
        <div style="font-size:13px;color:#7A7480;margin-top:3px">Esta semana vs. la anterior</div>
      </div>

      <div class="divider"></div>

      <!-- Legend -->
      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot" style="background:#E8967A"></div>Esta semana
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:#D8D4CE"></div>Semana anterior
        </div>
      </div>

      <!-- TikTok: 2h15m vs 1h50m → +25m -->
      <div class="comp-row">
        <div class="app-icon" style="background:#E8E3F5;color:#6B5B95;align-self:flex-start">Ti</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <div class="comp-name">TikTok</div>
            <div class="delta d-up">+25m</div>
          </div>
          <div class="comp-cat">Vídeo</div>
          <div class="comp-bars">
            <div class="bar-row"><div class="bar-fill bar-this" style="width:100px"></div><span class="bar-lbl">2h 15m</span></div>
            <div class="bar-row"><div class="bar-fill bar-prev" style="width:81px"></div><span class="bar-lbl">1h 50m</span></div>
          </div>
        </div>
      </div>

      <!-- Instagram: 1h40m vs 2h10m → -30m -->
      <div class="comp-row">
        <div class="app-icon" style="background:#FBE9E1;color:#E8967A;align-self:flex-start">In</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <div class="comp-name">Instagram</div>
            <div class="delta d-dn">-30m</div>
          </div>
          <div class="comp-cat">Redes sociales</div>
          <div class="comp-bars">
            <div class="bar-row"><div class="bar-fill bar-this" style="width:74px"></div><span class="bar-lbl">1h 40m</span></div>
            <div class="bar-row"><div class="bar-fill bar-prev" style="width:96px"></div><span class="bar-lbl">2h 10m</span></div>
          </div>
        </div>
      </div>

      <!-- WhatsApp: 55m vs 1h10m → -15m -->
      <div class="comp-row">
        <div class="app-icon" style="background:#D8EDD9;color:#4A8050;align-self:flex-start">Wa</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <div class="comp-name">WhatsApp</div>
            <div class="delta d-dn">-15m</div>
          </div>
          <div class="comp-cat">Mensajería</div>
          <div class="comp-bars">
            <div class="bar-row"><div class="bar-fill bar-this" style="width:41px"></div><span class="bar-lbl">55m</span></div>
            <div class="bar-row"><div class="bar-fill bar-prev" style="width:52px"></div><span class="bar-lbl">1h 10m</span></div>
          </div>
        </div>
      </div>

      <!-- YouTube: 35m vs 40m → -5m -->
      <div class="comp-row">
        <div class="app-icon" style="background:#FFE8DC;color:#C44000;align-self:flex-start">Yo</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <div class="comp-name">YouTube</div>
            <div class="delta d-fl">-5m</div>
          </div>
          <div class="comp-cat">Vídeo</div>
          <div class="comp-bars">
            <div class="bar-row"><div class="bar-fill bar-this" style="width:26px"></div><span class="bar-lbl">35m</span></div>
            <div class="bar-row"><div class="bar-fill bar-prev" style="width:30px"></div><span class="bar-lbl">40m</span></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Tab bar -->
    <div class="tab-bar">
      <div class="tab-item">
        <svg width="21" height="21" viewBox="0 0 21 21" fill="none">
          <rect x="2.5" y="13"   width="4" height="5.5"  rx="1.2" stroke="#7A7480" stroke-width="1.5"/>
          <rect x="8.5" y="8"    width="4" height="10.5" rx="1.2" stroke="#7A7480" stroke-width="1.5"/>
          <rect x="14.5" y="4.5" width="4" height="14"   rx="1.2" stroke="#7A7480" stroke-width="1.5"/>
        </svg>
        Mapa
      </div>
      <div class="tab-item active">
        <svg width="21" height="21" viewBox="0 0 21 21" fill="none">
          <path d="M3 7.5H13.5"  stroke="#E8967A" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M10.5 4.5L13.5 7.5L10.5 10.5" stroke="#E8967A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 13.5H7.5" stroke="#E8967A" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M10.5 10.5L7.5 13.5L10.5 16.5" stroke="#E8967A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Comparativa
      </div>
    </div>
    <div class="home-bar-wrap"><div class="home-bar"></div></div>
  </div>
</div>
